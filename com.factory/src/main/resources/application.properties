
# ==========================================
# APPLICATION CONFIGURATION
# ==========================================
spring.application.name=com.factorymaintenance

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
# Local MySQL is used by default.
# Render overrides these values using environment variables.

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/factory_maintenance}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=${PORT:8080}
